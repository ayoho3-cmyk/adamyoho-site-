name = "adam-yoho-culinary"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

# IMPORTANT: Wrangler treats the [[routes]] list below as the COMPLETE,
# authoritative set of routes/custom domains for this Worker. Any domain
# not listed here gets removed on deploy -- this is what broke the apex
# domain (adamyoho.com) after it was originally set up manually in the
# dashboard but never added to this file. Both domains must be declared.
[[routes]]
pattern = "adamyoho.com"
custom_domain = true

[[routes]]
pattern = "www.adamyoho.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "adam-yoho-culinary-db"
database_id = "fab3cb91-1ed3-453a-9d93-c8723fc9b4f2"
migrations_dir = "worker/migrations"

[assets]
directory = "./dist"
binding = "ASSETS"
# React Router / client-side routing: unmatched, non-asset paths should
# fall back to index.html rather than 404ing.
not_found_handling = "single-page-application"

[vars]
APP_URL = "https://adamyoho.com"

# Uncomment and set via `wrangler secret put` (not in this file) if/when
# newsletter signups should forward to an email marketing provider:
# EMAIL_MARKETING_PROVIDER
# EMAIL_MARKETING_WEBHOOK_URL

[observability]
enabled = true
