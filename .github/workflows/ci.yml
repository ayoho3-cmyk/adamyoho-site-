name: Production CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Lint, Typecheck, and Production Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run ESLint & TypeScript Typecheck
        run: npm run lint

      - name: Production Bundle & Build Verification
        run: npm run build

      - name: Verify Dist Artifacts
        run: |
          test -f dist/index.html || exit 1
          echo "Production build validation succeeded."

  deploy:
    name: Deploy to Cloudflare Workers
    needs: validate-and-build
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Production Build
        run: npm run build

      - name: Verify Cloudflare Secret Configuration
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set in this GitHub repository!"
            echo "To fix: Go to GitHub Repo -> Settings -> Secrets and variables -> Actions -> Repository secrets -> Add CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

