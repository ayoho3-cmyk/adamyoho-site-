name: Production CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-build:
    name: Lint, Typecheck, and Production Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint & TypeScript Typecheck
        run: npm run lint

      - name: Production Bundle & Build Verification
        run: npm run build

      - name: Verify Dist Artifacts
        run: |
          test -f dist/index.html || exit 1
          test -f dist/server.cjs || exit 1
          echo "Production build validation succeeded."
